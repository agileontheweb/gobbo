<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Teleprompter Pro - I Miei Monologhi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-[#121212] text-white font-sans h-screen overflow-hidden">

    <div id="setup-screen" class="flex flex-col h-full p-6 gap-4 max-w-3xl mx-auto overflow-y-auto">
        <h1 class="text-2xl font-bold text-green-400 flex items-center gap-2">
            <span>🎬</span> My Monologues
        </h1>

        <div class="flex gap-2">
            <select id="script-selector"
                class="flex-1 bg-zinc-800 border border-zinc-700 rounded-lg p-2 outline-none focus:ring-2 focus:ring-green-500 text-sm">
                <option value="">-- Carica un monologo --</option>
            </select>
            <button onclick="deleteScript()"
                class="bg-red-900/30 hover:bg-red-600 text-red-400 hover:text-white px-4 rounded-lg transition-colors text-xs font-bold">
                ELIMINA
            </button>
        </div>

        <input type="text" id="script-title"
            class="bg-zinc-900 border border-zinc-700 rounded-lg p-3 outline-none focus:ring-2 focus:ring-green-500"
            placeholder="Titolo del nuovo monologo...">

        <textarea id="input-text"
            class="flex-1 min-h-[200px] bg-zinc-900 border border-zinc-700 rounded-xl p-4 text-lg focus:ring-2 focus:ring-green-500 outline-none resize-none"
            placeholder="Scrivi o incolla qui il tuo testo..."></textarea>

        <div class="flex gap-3 pb-6">
            <button onclick="saveCurrentScript()"
                class="flex-1 bg-zinc-700 hover:bg-zinc-600 font-bold py-4 rounded-xl transition-all uppercase text-xs tracking-widest">
                Salva Bozza
            </button>
            <button onclick="startApp()"
                class="flex-[2] bg-green-500 hover:bg-green-600 text-black font-bold py-4 rounded-xl transition-all uppercase tracking-wider shadow-[0_0_20px_rgba(34,197,94,0.3)]">
                Avvia Teleprompter
            </button>
        </div>
    </div>

    <div id="recording-screen"
        class="hidden relative h-full w-full bg-black flex justify-center items-center overflow-hidden">

        <!-- Anteprima Video -->
        <video id="preview" autoplay muted playsinline class="absolute inset-0 w-full h-full object-cover"></video>

        <div id="countdown-overlay"
            class="absolute inset-0 z-40 hidden bg-black/80 backdrop-blur-sm flex justify-center items-center">
            <span id="countdown-number" class="text-8xl font-black text-green-400 animate-pulse">3</span>
        </div>



        <div id="prompter-overlay"
            class="absolute inset-0 z-10 overflow-y-auto py-[50vh] px-8 text-center scroll-smooth">
            <div id="prompter-text" class="leading-tight font-bold"></div>
        </div>

        <div class="absolute bottom-6 left-0 right-0 z-30 flex flex-col items-center gap-4 px-4 pointer-events-none">

            <!-- Pannello Regolazioni Camera (nascosto di default, si apre con l'ingranaggio) -->
            <div id="camera-settings-panel"
                class="hidden pointer-events-auto bg-black/80 backdrop-blur-md px-5 py-4 rounded-2xl border border-white/20 flex-col gap-3 mb-2 shadow-2xl w-full max-w-sm">

                <div class="flex flex-col gap-1">
                    <div class="flex justify-between items-center">
                        <span class="text-[10px] uppercase font-black text-zinc-400 tracking-tighter">Font</span>
                        <span id="live-font-val" class="text-green-400 font-mono text-xs font-bold">45px</span>
                    </div>
                    <input type="range" id="live-font-size" min="20" max="150" value="45"
                        class="w-full accent-green-500 cursor-pointer">
                </div>

                <div id="focus-control" class="hidden flex-col gap-1">
                    <div class="flex justify-between items-center">
                        <span class="text-[10px] uppercase font-black text-zinc-400 tracking-tighter">🎯 Fuoco</span>
                        <span id="focus-val" class="text-green-400 font-mono text-xs font-bold">-</span>
                    </div>
                    <input type="range" id="focus-slider" step="0.01" class="w-full accent-green-500 cursor-pointer">
                </div>

                <div id="exposure-control" class="hidden flex-col gap-1">
                    <div class="flex justify-between items-center">
                        <span class="text-[10px] uppercase font-black text-zinc-400 tracking-tighter">☀️
                            Esposizione</span>
                        <span id="exposure-val" class="text-green-400 font-mono text-xs font-bold">-</span>
                    </div>
                    <input type="range" id="exposure-slider" step="0.01" class="w-full accent-green-500 cursor-pointer">
                </div>

                <div id="wb-control" class="hidden flex-col gap-1">
                    <div class="flex justify-between items-center">
                        <span class="text-[10px] uppercase font-black text-zinc-400 tracking-tighter">🎨 Temp.
                            colore</span>
                        <span id="wb-val" class="text-green-400 font-mono text-xs font-bold">-</span>
                    </div>
                    <input type="range" id="wb-slider" step="50" class="w-full accent-green-500 cursor-pointer">
                </div>

                <button onclick="resetCameraSettings()"
                    class="text-[10px] uppercase font-black text-zinc-500 hover:text-white tracking-tighter self-end">
                    ↺ reset auto
                </button>
            </div>

            <div class="flex justify-center items-center gap-4 pointer-events-auto">
                <button id="recBtn" onclick="toggleRecord()"
                    class="bg-red-600 hover:bg-red-500 text-white px-12 py-4 rounded-full font-black shadow-2xl active:scale-95 transition-all uppercase tracking-widest">REC</button>
                <button onclick="toggleCameraSettingsPanel()"
                    class="bg-zinc-800/80 hover:bg-zinc-700 text-white p-4 rounded-full shadow-lg backdrop-blur-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                </button>
                <button onclick="exitApp()"
                    class="bg-zinc-800/80 hover:bg-zinc-700 text-white px-6 py-4 rounded-full font-bold shadow-lg backdrop-blur-sm">CHIUDI</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
